<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0a0c"/>
  
  <!-- Bite-mark icon -->
  <defs>
    <mask id="bite">
      <rect width="1200" height="630" fill="white"/>
      <circle cx="395" cy="245" r="55" fill="black"/>
    </mask>
  </defs>
  <circle cx="330" cy="300" r="100" fill="#10b981" mask="url(#bite)"/>
  <circle cx="305" cy="270" r="9" fill="white" opacity="0.9"/>
  <circle cx="305" cy="270" r="4" fill="white"/>
  
  <!-- Wordmark -->
  <text x="470" y="310" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="900" font-size="80" fill="#f0f0f0" letter-spacing="-2">hewber</text>
  
  <!-- Subtitle -->
  <text x="470" y="365" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="400" font-size="28" fill="#a1a1aa">Food score in seconds</text>
  
  <!-- Score hint -->
  <rect x="1020" y="480" width="100" height="100" rx="20" fill="#141416" stroke="#1e1e22" stroke-width="2"/>
  <text x="1070" y="545" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="900" font-size="40" fill="#10b981" text-anchor="middle">87</text>
  <text x="1070" y="565" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-weight="400" font-size="10" fill="#a1a1aa" text-anchor="middle">score</text>
  
  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#10b981" opacity="0.6"/>
</svg>
